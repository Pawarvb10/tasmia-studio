<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tasmia Designers · Studio</title>
<style>
/* VOICE: a calm atelier ledger — precise, warm, never shouty
   IDEA: the studio's order book and job tags, garment by garment
   PICTURE: each garment is a tag card with its own stage trail
   COLOUR and TYPE: wine & ivory with antique gold accent; Georgia titles, system UI body
   LAYOUT: sidebar on desktop, top bar + drawer on phones; tables collapse to cards */
:root{color-scheme:light;--bg:#f6f2ec;--panel:#fff;--ink:#2b2226;--muted:#76686d;--line:#e7ded6;--accent:#7a2948;--accent-2:#621f39;--accent-soft:#f4e6ec;--gold:#a8741a;--gold-soft:#fff8e6;--ok:#2e7d4f;--ok-soft:#e5f3ea;--warn:#9a5b00;--warn-soft:#fbf0dc;--bad:#b3261e;--bad-soft:#fbe6e4;--info:#2f5d8a;--info-soft:#e6eef7;--side:#2b1a22}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);overflow-x:clip}
a{color:var(--accent)}
.app{display:flex;min-height:100vh}
nav.side{width:228px;background:var(--side);color:#eadfe3;padding:16px 10px;position:sticky;top:0;height:100vh;flex-shrink:0;overflow:auto;z-index:30}
.brand{font-family:Georgia,serif;font-size:19px;color:#fff;padding:2px 10px 12px;line-height:1.2}
.brand img{max-height:48px;max-width:150px;display:block;margin-bottom:8px;border-radius:6px}
.brand small{display:block;font:11px system-ui;color:#c9b3bd;margin-top:4px}
nav.side a{display:flex;justify-content:space-between;align-items:center;color:#eadfe3;text-decoration:none;padding:8px 10px;border-radius:8px;margin:1px 0;font-size:13.5px}
nav.side a:hover{background:#3d2631}
nav.side a.on{background:var(--accent);color:#fff}
nav.side .grp{font-size:11px;color:#a8939c;margin:12px 10px 3px}
nav.side .foot{font-size:11.5px;color:#b9a5ae;padding:14px 10px 0;line-height:1.5}
.who{background:#3d2631;border-radius:10px;padding:8px 10px;margin:4px 0 8px;font-size:12.5px}
.who b{color:#fff;display:block}
.badge{background:#e0453a;color:#fff;border-radius:10px;padding:0 7px;font-size:11px;line-height:18px}
.topbar{display:none}
main{flex:1;padding:20px 26px 80px;min-width:0}
h1{font-family:Georgia,serif;font-weight:normal;font-size:26px;margin:0 0 4px;line-height:1.15}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:12px;letter-spacing:.03em;color:var(--muted);margin:0 0 10px;font-weight:600}
.sub{color:var(--muted);margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row+.row{margin-top:8px}
.ac{align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:1100px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.fgrid .full{grid-column:1/-1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:default}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--accent)}
.kpi b{display:block;font-size:22px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12px}
.kpi small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.kpi.bad b{color:var(--bad)} .kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--warn)}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11.5px;color:var(--muted);font-weight:600;background:#faf7f3;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:#fbf6f8}
tr.late td{background:#fff7f6}
table.ed td{padding:4px}
.scroll{overflow-x:auto}
input,select,textarea{font:inherit;color:inherit;border:1px solid #d9cec5;border-radius:8px;padding:7px 9px;background:#fff;width:100%;min-height:36px}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--accent)}
input[type=range]{padding:0;border:0;accent-color:var(--accent)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
td input,td select{padding:5px 7px;min-height:32px}
textarea{resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
label.inline{display:inline-flex;gap:6px;align-items:center;color:var(--ink);font-size:13.5px;margin:0 12px 0 0}
.f{flex:1;min-width:150px}
.f.s{flex:0 0 130px;min-width:110px}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;min-height:36px}
button:hover,.btn:hover{border-color:var(--accent)}
button:focus-visible,.btn:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.pri:hover{background:var(--accent-2)}
.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.sm{padding:3px 9px;font-size:12.5px;min-height:30px}
.ghost{background:none;border-color:transparent;color:var(--muted)}
.danger{color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;background:#eee;white-space:nowrap;font-weight:500}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-warn{background:var(--warn-soft);color:var(--warn)} .c-bad{background:var(--bad-soft);color:var(--bad)} .c-info{background:var(--info-soft);color:var(--info)} .c-acc{background:var(--accent-soft);color:var(--accent)} .c-mut{background:#efebe7;color:var(--muted)} .c-gold{background:var(--gold-soft);color:var(--gold)}
.urgent{background:var(--bad);color:#fff;font-weight:700;letter-spacing:.02em}
.muted{color:var(--muted)} .right{text-align:right} .sp{flex:1} .acc{color:var(--accent)} .nowrap{white-space:nowrap}
.bar{height:8px;background:#efe7e0;border-radius:5px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)} .bar i.ok{background:var(--ok)}
.note{background:#fbf8f4;border:1px dashed #dccfc4;border-radius:8px;padding:10px 12px}
.flag{border-left:4px solid var(--bad);background:var(--bad-soft);padding:9px 12px;border-radius:8px;margin-bottom:10px}
.flag.gold{border-left-color:var(--gold);background:var(--gold-soft)}
.flag.info{border-left-color:var(--info);background:var(--info-soft)}
.flag.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border-radius:20px}
.tabs .on{background:var(--accent);border-color:var(--accent);color:#fff}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.msec-t{font-weight:600;font-size:13px;margin:8px 0 4px}
.empty{padding:26px;text-align:center;color:var(--muted)}
/* garment trail */
.trail{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:6px 0}
.st{padding:3px 10px;border-radius:14px;font-size:12px;border:1px solid var(--line);background:#fff;white-space:nowrap}
.st.done{background:var(--ok-soft);border-color:#bfe0cb;color:var(--ok)}
.st.prog{background:var(--accent);border-color:var(--accent);color:#fff}
.st.skip{text-decoration:line-through;color:#aaa}
.st.late{border-color:var(--bad);color:var(--bad)}
.st.ext{border-style:dashed}
.arrow{color:#c8b9b0}
/* garment tag cards */
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.gcard{background:#fff;border:1px solid var(--line);border-left:5px solid #c9a3b4;border-radius:10px;padding:10px 12px;cursor:pointer}
.gcard:hover{border-color:var(--accent)}
.gcard.late{border-left-color:var(--bad)} .gcard.urg{border-left-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad-soft)} .gcard.prog{border-left-color:var(--accent)} .gcard.ext{border-left-color:var(--info)} .gcard.ok{border-left-color:var(--ok)}
.gcard .t{font-weight:600}
/* board: wraps instead of scrolling sideways */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;align-items:start}
.col{background:#efe8e1;border-radius:12px;padding:10px}
.col-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-weight:600;cursor:pointer}
.col-h small{font-weight:normal;color:var(--muted)}
.col .gcard{margin-bottom:8px}
/* timeline */
.gantt{position:relative;font-size:12px}
.g-row{display:flex;align-items:center;border-bottom:1px solid #f1ebe5;min-height:28px}
.g-lab{width:230px;flex-shrink:0;padding:3px 8px 3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-track{position:relative;flex:1;height:26px}
.g-bar{position:absolute;top:6px;height:14px;border-radius:4px;background:#c9a3b4}
.g-bar.done{background:#9ccfb0} .g-bar.prog{background:var(--accent)} .g-bar.ext{background:repeating-linear-gradient(45deg,#9fb6d1,#9fb6d1 4px,#b8cbe0 4px,#b8cbe0 8px)} .g-bar.late{outline:2px solid var(--bad)} .g-bar.trial{background:#7fb8ab}
.g-head{display:flex;border-bottom:1px solid var(--line)}
.g-head .g-track{height:20px}
.g-tick{position:absolute;top:2px;font-size:10.5px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.g-line{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--info);z-index:2}
.g-line.prom{border-left:2px dashed var(--bad)}
.g-legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.g-legend i{display:inline-block;width:14px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
/* week planner */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;min-height:120px}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day.off{background:#f3eee9}
.day h4{margin:0 0 6px;font-size:12.5px;display:flex;justify-content:space-between}
.pill{display:block;font-size:11.5px;padding:3px 6px;border-radius:6px;margin-bottom:4px;background:var(--accent-soft);color:var(--accent);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.del{background:var(--ok-soft);color:var(--ok)} .pill.tr{background:var(--info-soft);color:var(--info)} .pill.late{background:var(--bad-soft);color:var(--bad)} .pill.st{background:var(--gold-soft);color:var(--gold)}
@media(max-width:900px){.week{grid-template-columns:minmax(0,1fr)}.day{min-height:0}}
/* alerts */
.alert{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;margin-bottom:8px;border-left:5px solid #ccc;flex-wrap:wrap}
.alert.critical{border-left-color:#8c1d18} .alert.high{border-left-color:var(--bad)} .alert.medium{border-left-color:var(--warn)} .alert.low{border-left-color:#b9b0aa}
.alert .b{flex:1;min-width:220px}
.alert .t{font-weight:600}
/* design & media */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.dcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
.dcard:hover{border-color:var(--accent)}
.dimg{aspect-ratio:4/3;background:#f1ebe5 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#c8b9b0;font-size:28px}
.dcard .b{padding:10px 12px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:8px;background:#f1ebe5 center/cover no-repeat;border:1px solid var(--line);cursor:zoom-in}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(43,26,34,.72);color:#fff;font-size:10.5px;padding:2px 5px;border-radius:0 0 8px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb.missing::after{content:'missing';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
.tbtn{position:absolute;top:4px;right:4px;padding:0 6px;font-size:11px;line-height:20px;min-height:0;border-radius:6px;background:rgba(255,255,255,.94);color:var(--bad)}
.ver{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fff}
.ver.appr{border:2px solid var(--ok);background:#fbfffc}
.ver.old{opacity:.86}
.spin{background:#f4eef0;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.spin img{display:block;width:100%;height:320px;object-fit:contain;cursor:grab;user-select:none;touch-action:pan-y}
.spin-ui{display:flex;gap:10px;align-items:center;padding:8px 10px;background:#fff;border-top:1px solid var(--line)}
.spin-ui input{flex:1}
.logo-box{width:140px;height:84px;border:1px dashed #d9cec5;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff;padding:6px}
.logo-box img{max-width:100%;max-height:100%}
/* history */
.hist{max-height:520px;overflow:auto}
.hrow{display:flex;gap:12px;border-bottom:1px solid var(--line);padding:8px 0}
.hwhen{width:150px;flex-shrink:0;font-size:12px}
.hrow ul{margin:4px 0 0;padding-left:18px;font-size:12.5px}
.hrow s{color:#a88}
/* QC */
.qc-sec{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.qc-item{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed #eee;flex-wrap:wrap}
.qc-item span{flex:1;min-width:200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{margin:0;padding:4px 10px;font-size:12.5px;color:var(--ink);cursor:pointer;display:flex;gap:4px;align-items:center}
.seg input{display:none}
.seg label:has(input:checked){background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg label.p:has(input:checked){background:var(--ok-soft);color:var(--ok)}
.seg label.x:has(input:checked){background:var(--bad-soft);color:var(--bad)}
/* delivery steps */
.dsteps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.dstep{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.dstep.done{background:var(--ok-soft);border-color:#bfe0cb}
@media(max-width:700px){.dsteps{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
/* modal & dialogs */
#modal{position:fixed;inset:0;background:rgba(30,15,22,.45);display:none;align-items:flex-start;justify-content:center;padding:24px;overflow:auto;z-index:50}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:12px;max-width:900px;width:100%;padding:20px}
.mbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
#ask{position:fixed;inset:0;background:rgba(30,15,22,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:70;overflow:auto}
#ask.on{display:flex}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#2b1a22;color:#fff;padding:10px 14px;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:420px}
.toast.bad{background:var(--bad)} .toast.ok{background:var(--ok)}
.sync{font-size:11.5px;padding:3px 8px;border-radius:10px;background:#3d2631;color:#d9c6cf;display:inline-block;margin:0 10px}
.sync.saving{color:#f3dca2} .sync.remote{background:var(--gold);color:#fff}
/* order editor */
.gblock{border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:14px;margin-bottom:14px;background:#fff}
.gnum{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.osum{position:sticky;bottom:0;box-shadow:0 -6px 20px rgba(43,26,34,.08);border-color:#d9c6cf;z-index:5}
.sumgrid{display:flex;gap:20px;flex-wrap:wrap}
.sumgrid span{display:block;font-size:11.5px;color:var(--muted)}
.sumgrid b{font-size:16px;font-variant-numeric:tabular-nums}
.search{position:relative}
.search .res{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:40;max-height:360px;overflow:auto}
.search .res a{display:block;padding:8px 12px;text-decoration:none;color:var(--ink);border-bottom:1px solid #f2ece6}
.search .res a:hover{background:var(--accent-soft)}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#2b1a22,#5b1d36)}
.login .box{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:560px}
.utiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.utile{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:#fff;text-align:left;display:block;min-height:0}
.utile.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
/* mobile */
@media(max-width:900px){
  nav.side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-105%);transition:transform .2s;width:260px;box-shadow:0 0 30px rgba(0,0,0,.3)}
  body.navon nav.side{transform:none}
  .topbar{display:flex;position:sticky;top:0;z-index:25;background:var(--side);color:#fff;padding:8px 10px;gap:8px;align-items:center}
  .topbar button{background:#3d2631;border-color:#3d2631;color:#fff}
  .topbar .t{font-family:Georgia,serif;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .app{display:block}
  main{padding:14px 12px 90px}
  h1{font-size:22px}
  .card{padding:12px}
  .g-lab{width:120px}
  .hwhen{width:100px}
  input,select,textarea{font-size:16px}
}
@media(max-width:600px){
  table{font-size:13px}
  .stack thead{display:none}
  .stack tr{display:grid;padding:8px 0;border-bottom:1px solid var(--line)}
  .stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8.5em;text-align:start}
  .stack td::before{content:attr(data-l);float:inline-start;width:8em;margin-inline-start:-8.5em;color:var(--muted);font-size:12px;white-space:normal}
  .stack td:empty{display:none}
  .stack td.n{text-align:start}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gcards{grid-template-columns:minmax(0,1fr)}
  #modal{padding:8px}
  .mbox{padding:14px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* measurement diagram cards */
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:8px}
.mcard{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,box-shadow .15s}
.mcard:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.mcard.done{border-color:var(--ok);background:linear-gradient(#fff,#fff) padding-box}
.mcard.done .mno{background:var(--ok);color:#fff}
.mcard.view.empty{opacity:.55}
.mhead{display:flex;gap:6px;align-items:flex-start;min-height:34px}
.mno{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.mlab{font-size:12.5px;font-weight:600;line-height:1.25}

<script>
'use strict';
/* =====================================================================
   Tasmia Designers — Boutique Order-to-Billing v3
   core.js : utilities, permissions, storage (local + central), change
             history, media files, downloads, PDF engine
   ===================================================================== */
const APP_VERSION = '3.0';
const STORE = 'boutique_o2b_v3';
const CPLX = {Simple: 1, Medium: 1.5, Heavy: 2, Couture: 3};
let DB = null;            // in-memory data
let ME = null;            // {id, name, role, workerId}
let MODE = 'local';       // 'local' | 'central'
let SC = null;            // schedule cache
let HOL = null;           // holiday cache
let EDIT = null;          // order draft
const UI = {};            // per-view UI state

/* ---------------- utilities ---------------- */
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const v = x => h(x ?? '');
const num = x => { const n = parseFloat(x); return isNaN(n) ? 0 : n; };
const r2 = x => Math.round(num(x) * 100) / 100;
const inr = x => '₹' + Math.round(num(x)).toLocaleString('en-IN');
const inr2 = x => '₹' + num(x).toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const rs = x => 'Rs. ' + num(x).toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const uid = p => (p || 'x') + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 7);
const clone = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
const nowISO = () => new Date().toISOString();
function iso(d){ const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); }
const todayISO = () => iso(new Date());
function parseD(s){ return new Date(String(s).length === 10 ? s + 'T00:00:00' : s); }
function fmtD(s){ if(!s) return '—'; const d = parseD(s); return isNaN(d) ? '—' : d.toLocaleDateString('en-IN', {day: '2-digit', month: 'short', year: 'numeric'}); }
function fmtDs(s){ if(!s) return '—'; const d = parseD(s); return isNaN(d) ? '—' : d.toLocaleDateString('en-IN', {day: '2-digit', month: 'short'}); }
function fmtDT(s){ if(!s) return '—'; const d = parseD(s); return isNaN(d) ? '—' : d.toLocaleString('en-IN', {day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'}); }
function sod(d){ const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function addDaysISO(s, n){ return iso(addDays(parseD(s), n)); }
function daysBetween(a, b){ return Math.round((sod(parseD(b)) - sod(parseD(a))) / 864e5); }
const opt = (val, label, cur) => `<option value="${h(val)}" ${String(val) === String(cur ?? '') ? 'selected' : ''}>${h(label)}</option>`;
function getPath(o, p){ return p.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, p, val){ const ks = p.split('.'); let x = o; for(let i = 0; i < ks.length - 1; i++){ if(x[ks[i]] == null) x[ks[i]] = {}; x = x[ks[i]]; } x[ks[ks.length - 1]] = val; }
function toast(msg, type){ const t = document.createElement('div'); t.className = 'toast ' + (type || ''); t.textContent = msg; document.getElementById('toasts').appendChild(t); setTimeout(() => t.remove(), 4200); }
function words(n){
  n = Math.floor(num(n)); if(n === 0) return 'Zero';
  const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = x => x < 20 ? a[x] : b[Math.floor(x / 10)] + (x % 10 ? ' ' + a[x % 10] : '');
  const three = x => (x >= 100 ? a[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' : '') : '') + (x % 100 ? two(x % 100) : '');
  let s = ''; const cr = Math.floor(n / 1e7); n %= 1e7; const l = Math.floor(n / 1e5); n %= 1e5; const th = Math.floor(n / 1000); n %= 1000;
  if(cr) s += (cr >= 100 ? words(cr) : two(cr)) + ' Crore ';
  if(l) s += two(l) + ' Lakh '; if(th) s += two(th) + ' Thousand '; if(n) s += three(n);
  return s.trim();
}
function amountWords(x){ const p = Math.round((num(x) % 1) * 100); return 'Rupees ' + words(x) + (p ? ' and ' + words(p) + ' Paise' : '') + ' Only'; }
function waLink(phone, text){ let d = String(phone || '').replace(/\D/g, ''); if(d.length === 10) d = '91' + d; return `https://wa.me/${d}?text=${encodeURIComponent(text)}`; }
function smsLink(phone, text){ let d = String(phone || '').replace(/\D/g, ''); if(d.length === 10) d = '91' + d; return `sms:${d ? '+' + d : ''}?body=${encodeURIComponent(text)}`; }
const IN_FRAME = (() => { try{ return window.self !== window.top; }catch(e){ return true; } })();
const by = (f, dir) => (a, b) => { const x = f(a), y = f(b); return (x < y ? -1 : x > y ? 1 : 0) * (dir || 1); };
const sum = (arr, f) => arr.reduce((a, x) => a + num(f ? f(x) : x), 0);
const isNarrow = () => window.matchMedia('(max-width: 900px)').matches;

/* ---------------- lookups ---------------- */
const ST = () => DB.settings;
const coll = n => DB[n] || (DB[n] = []);
const find = (n, id) => id ? coll(n).find(x => x.id === id) : undefined;
const cust = id => find('customers', id);
const ord = id => find('orders', id);
const gar = id => find('garments', id);
const worker = id => find('workers', id);
const vendor = id => find('vendors', id);
const tpl = id => find('templates', id);
const design = id => find('designs', id);
const item = id => find('inventory', id);
const prof = id => find('profiles', id);
const inv = id => find('invoices', id);
const stage = id => find('stages', id) || {id, name: id || '?', kind: 'work', group: 'other', head: 'other', rate: 0};
const garmentsOf = oid => coll('garments').filter(g => g.orderId === oid).sort(by(g => g.idx));
const headName = id => (ST().heads.find(x => x.id === id) || {name: id || 'Other'}).name;

/* ---------------- roles & permissions ---------------- */
const PERMS = [
  ['dash', 'Dashboard (production)'], ['mytasks', 'My tasks'], ['orders', 'View orders & garments'], ['orders.edit', 'Create & edit orders'],
  ['customers', 'Customers & measurements'], ['production', 'Update production steps'], ['planner', 'Stitching & delivery planner'],
  ['embroidery', 'Embroidery & handwork'], ['trials', 'Trials & alterations'], ['qc', 'QC & delivery'], ['workers', 'Workers & workload'],
  ['payroll', 'Worker payments'], ['vendors', 'Outside vendors'], ['vendors.pay', 'Vendor payments'], ['inventory', 'Materials & inventory'],
  ['billing', 'Billing, invoices & receipts'], ['prices', 'See prices & costs'], ['reports', 'Owner reports & profitability'],
  ['comms', 'Customer communication'], ['config', 'Configurator (garment types, designs)'], ['setup', 'Setup, users & backups'], ['alerts', 'Alerts']];
const ROLES = {owner: 'Owner', manager: 'Manager / front desk', master: 'Cutting & stitching master', artisan: 'Artisan / worker', accounts: 'Accounts'};
function defaultPerms(){
  const all = PERMS.map(p => p[0]);
  return {
    owner: all,
    manager: all.filter(p => !['setup', 'reports'].includes(p)),
    master: ['dash', 'mytasks', 'orders', 'customers', 'production', 'planner', 'embroidery', 'trials', 'qc', 'workers', 'inventory', 'alerts', 'comms'],
    artisan: ['mytasks'],
    accounts: ['dash', 'orders', 'customers', 'billing', 'prices', 'payroll', 'vendors', 'vendors.pay', 'reports', 'inventory', 'alerts', 'comms']
  };
}
function can(p){ if(!ME) return false; if(ME.role === 'owner') return true; return ((ST().perms || defaultPerms())[ME.role] || []).includes(p); }
const meName = () => ME ? ME.name : 'System';

/* ---------------- change history ---------------- */
function diffObj(a, b, path, out){
  out = out || []; path = path || '';
  if(out.length > 40) return out;
  const ign = /^(history|_|updated)/;
  if(a && b && typeof a === 'object' && typeof b === 'object' && !Array.isArray(a) && !Array.isArray(b)){
    new Set([...Object.keys(a), ...Object.keys(b)]).forEach(k => { if(!ign.test(k)) diffObj(a[k], b[k], path ? path + '.' + k : k, out); });
    return out;
  }
  if(Array.isArray(a) && Array.isArray(b) && a.every(x => x && x.id) && b.every(x => x && x.id)){
    const ma = new Map(a.map(x => [x.id, x])), mb = new Map(b.map(x => [x.id, x]));
    b.forEach(x => { if(!ma.has(x.id)) out.push({f: path, from: '', to: 'added ' + (x.name || x.label || x.desc || x.instruction || stageNameSafe(x.stageId) || 'entry')}); else diffObj(ma.get(x.id), x, path + '[' + (x.name || x.label || stageNameSafe(x.stageId) || x.id) + ']', out); });
    a.forEach(x => { if(!mb.has(x.id)) out.push({f: path, from: (x.name || x.label || x.desc || stageNameSafe(x.stageId) || 'entry'), to: 'removed'}); });
    return out;
  }
  const sa = a == null ? '' : typeof a === 'object' ? JSON.stringify(a) : String(a), sb = b == null ? '' : typeof b === 'object' ? JSON.stringify(b) : String(b);
  if(sa !== sb) out.push({f: path, from: sa.length > 120 ? sa.slice(0, 117) + '…' : sa, to: sb.length > 120 ? sb.slice(0, 117) + '…' : sb});
  return out;
}
function stageNameSafe(id){ try{ return id ? stage(id).name : ''; }catch(e){ return ''; } }
function logChange(ent, action, before, after){
  ent.history = ent.history || [];
  const changes = before !== undefined && after !== undefined ? diffObj(before, after) : [];
  if(before !== undefined && after !== undefined && !changes.length) return;
  ent.history.push({at: nowISO(), by: meName(), action, changes: changes.slice(0, 40)});
  if(ent.history.length > 200) ent.history.splice(0, ent.history.length - 200);
}
function histHTML(list){
  const L = (list || []).slice().reverse();
  if(!L.length) return '<div class="muted">No changes recorded yet.</div>';
  return `<div class="hist">${L.map(x => `<div class="hrow"><div class="muted hwhen">${fmtDT(x.at)}<br>${h(x.by)}</div><div><b>${h(x.action)}</b>${x.changes && x.changes.length ? `<ul>${x.changes.map(c => `<li><span class="muted">${h(c.f)}:</span> ${c.from !== '' ? `<s>${h(c.from)}</s> → ` : ''}${h(c.to)}</li>`).join('')}</ul>` : ''}</div></div>`).join('')}</div>`;
}

/* ---------------- storage: local + central ---------------- */
const COLLS = ['customers', 'profiles', 'orders', 'garments', 'workers', 'vendors', 'stages', 'templates', 'designs', 'inventory', 'movements', 'custMaterials', 'ledger', 'msgTemplates', 'msgLog', 'invoices'];
const CFG = {settings: 'config/settings', counters: 'counters/main', access: 'config/access', state: 'state/main'};
const SYNC = {db: null, user: null, assets: null, downloads: null, synced: new Map(), queue: new Map(), timer: null, flushing: false, subs: [], ready: false, pendingRender: false, firstLoad: {}, readOnly: false};

function emptyDB(){ const d = {settings: null, counters: {order: 1001, inv: 1, rcpt: 1}, access: {roles: {}}, state: {ack: {}, notified: {}, backups: []}}; COLLS.forEach(c => d[c] = []); return d; }
function save(){ SC = null; HOL = null; if(MODE === 'central') queueSync(); else saveLocal(); }
function saveLocal(){ try{ localStorage.setItem(STORE, JSON.stringify(DB)); }catch(e){ toast('Could not save on this device: ' + e.message, 'bad'); } }
function loadLocal(){ try{ const x = JSON.parse(localStorage.getItem(STORE)); return x && x.settings ? x : null; }catch(e){ return null; } }

/* central (claude artifact db) */
function docPaths(){
  const m = new Map();
  if(DB.settings) m.set(CFG.settings, DB.settings);
  m.set(CFG.counters, DB.counters); m.set(CFG.access, DB.access); m.set(CFG.state, DB.state);
  COLLS.forEach(c => coll(c).forEach(r => m.set(c + '/' + r.id, r)));
  return m;
}
function queueSync(){ clearTimeout(SYNC.timer); SYNC.timer = setTimeout(flushSync, 350); setSyncBadge('saving'); }
async function flushSync(){
  if(SYNC.flushing){ queueSync(); return; }
  SYNC.flushing = true;
  try{
    const cur = docPaths(), ops = [];
    cur.forEach((obj, path) => { const j = JSON.stringify(obj); if(SYNC.synced.get(path) !== j) ops.push({path, j}); });
    SYNC.synced.forEach((j, path) => { if(!cur.has(path)) ops.push({path, del: true}); });
    for(const op of ops){
      if(path0(op.path) === 'config' && !SYNC.isAdmin){ SYNC.synced.set(op.path, op.j); continue; }
      try{
        if(op.del){ await SYNC.db.doc(op.path).delete(); SYNC.synced.delete(op.path); }
        else { await SYNC.db.doc(op.path).set(JSON.parse(op.j)); SYNC.synced.set(op.path, op.j); }
      }catch(e){
        if(e && e.code === 'quota_exceeded') toast('Central database is full: ' + e.message, 'bad');
        else if(e && e.code === 'invalid_argument'){ SYNC.synced.set(op.path, op.j); if(!SYNC.warned){ SYNC.warned = 1; toast('You do not have permission to change some records — ask the owner for Contributor access.', 'bad'); } }
        else if(e && e.code === 'unavailable'){ await new Promise(r => setTimeout(r, 800 + Math.random() * 800)); try{ await SYNC.db.doc(op.path).set(JSON.parse(op.j)); SYNC.synced.set(op.path, op.j); }catch(_){} }
        else console.warn('sync', op.path, e);
      }
    }
    setSyncBadge('ok');
  } finally { SYNC.flushing = false; }
}
const path0 = p => p.split('/')[0];
function applyRemote(path, data){
  const j = data === null ? null : JSON.stringify(data);
  if(j !== null && SYNC.synced.get(path) === j) return false;
  const cur = docPaths(), local = cur.has(path) ? JSON.stringify(cur.get(path)) : null;
  const pendingLocal = SYNC.synced.has(path) ? local !== SYNC.synced.get(path) : local !== null && SYNC.firstLoad.done;
  if(pendingLocal) return false;
  const [c, id] = path.split('/');
  if(path === CFG.settings) DB.settings = j ? JSON.parse(j) : DB.settings;
  else if(path === CFG.counters){ if(j) DB.counters = JSON.parse(j); }
  else if(path === CFG.access){ if(j) DB.access = JSON.parse(j); }
  else if(path === CFG.state){ if(j) DB.state = JSON.parse(j); }
  else if(COLLS.includes(c)){
    const arr = coll(c), k = arr.findIndex(x => x.id === id);
    if(j === null){ if(k >= 0) arr.splice(k, 1); }
    else { const o = JSON.parse(j); if(k >= 0) arr[k] = o; else arr.push(o); }
  }
  if(j === null) SYNC.synced.delete(path); else SYNC.synced.set(path, j);
  return true;
}
function remoteChanged(){
  SC = null; HOL = null;
  if(!SYNC.ready) return;
  const a = document.activeElement;
  if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && document.getElementById('main').contains(a) || route().v === 'neworder'){ SYNC.pendingRender = true; setSyncBadge('remote'); return; }
  softRender();
}
document.addEventListener('focusout', () => setTimeout(() => { if(SYNC.pendingRender && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))){ SYNC.pendingRender = false; if(route().v !== 'neworder') softRender(); } }, 50));
function softRender(){ const y = window.scrollY; render(); window.scrollTo(0, y); }
function setSyncBadge(s){ const el = document.getElementById('syncBadge'); if(!el) return; el.className = 'sync ' + s; el.textContent = MODE === 'local' ? 'Saved on this device' : s === 'saving' ? 'Saving…' : s === 'remote' ? 'Updated by others — click away to refresh' : s === 'off' ? 'Offline — changes queued' : 'Central database · synced'; }

async function connectCentral(){
  let cl;
  try{ cl = window.claude && window.claude.use; }catch(e){ cl = null; }
  if(!cl) return false;
  const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]).catch(() => [null, null]);
  if(!db) return false;
  SYNC.db = db; SYNC.user = user;
  window.claude.use('assets').then(a => SYNC.assets = a).catch(() => {});
  window.claude.use('downloads').then(d => SYNC.downloads = d).catch(() => {});
  try{ SYNC.isOwner = user ? !!(await user.isOwner()) : false; SYNC.isAdmin = user ? !!(await user.canEdit()) || SYNC.isOwner : false; SYNC.uid = user ? await user.id() : null; }catch(e){}
  MODE = 'central'; DB = emptyDB();
  const loads = [];
  const sub = (q, isColl, name) => new Promise(res => {
    let first = true; const t = setTimeout(() => { if(first){ first = false; res(); } }, 10000);
    const un = isColl
      ? q.onSnapshot(snap => {
          let ch = false;
          snap.docChanges().forEach(c => { ch = applyRemote(name + '/' + c.doc.id, c.type === 'removed' ? null : c.doc.data()) || ch; });
          if(first && !snap.metadata.fromCache){ first = false; clearTimeout(t); res(); }
          else if(first){ /* wait for confirmed */ }
          if(!first && ch) remoteChanged();
        }, e => { if(first){ first = false; clearTimeout(t); res(); } if(e.code === 'revoked') SYNC.readOnly = true; })
      : q.onSnapshot(snap => {
          const ch = applyRemote(name, snap.exists ? snap.data() : null);
          if(first && !snap.metadata.fromCache){ first = false; clearTimeout(t); res(); }
          if(!first && ch) remoteChanged();
        }, () => { if(first){ first = false; clearTimeout(t); res(); } });
    SYNC.subs.push(un);
  });
  Object.values(CFG).forEach(p => loads.push(sub(db.doc(p), false, p)));
  COLLS.forEach(c => loads.push(sub(db.collection(c), true, c)));
  await Promise.all(loads);
  SYNC.firstLoad.done = true;
  return true;
}
async function nextNo(key){
  // sequential numbers (order / invoice / receipt) — leased in central mode so two devices never get the same number
  if(MODE === 'central'){
    const ref = SYNC.db.doc(CFG.counters);
    for(let i = 0; i < 14; i++){
      const l = await ref.acquire({holder: (SYNC.uid || 'x') + Math.random().toString(36).slice(2, 6), ttlMs: 1500}).catch(() => ({acquired: false}));
      if(l.acquired){
        const s = await ref.get(); const c = s.exists ? Object.assign({order: 1001, inv: 1, rcpt: 1}, clone(s.data())) : clone(DB.counters);

function convVal(x, from, to){
  if(x === '' || x == null || from === to) return x;
  const n = parseFloat(String(x).replace(',', '.')); if(isNaN(n)) return x;
  if(to === 'cm') return String(Math.round(n * 2.54 * 2) / 2);
  return String(Math.round(n / 2.54 * 4) / 4);
}

  qty = num(qty); if(qty <= 0) return;
  c.issued = r2(num(c.issued) + qty);
  if(c.itemId) coll('movements').push({id: uid('mv'), itemId: c.itemId, date: todayISO(), type: 'out', qty, rate: num(c.rate) || item(c.itemId)?.rate || 0, garmentId: g.id, orderId: g.orderId, note: note || 'Issued to ' + g.no, by: meName()});
}

/* ---------------- ledgers ---------------- */
function workerAccount(wid, from, to){
  const inR = d => (!from || d >= from) && (!to || d <= to);
  const jobs = []; coll('garments').forEach(g => g.steps.forEach(s => { if(s.workerId === wid && s.status === 'done' && !isOut(s) && s.doneAt && inR(iso(new Date(s.doneAt)))) jobs.push({g, s, amt: r2(stepAmount(s, g))}); }));
  const L = coll('ledger').filter(l => l.party === 'worker' && l.partyId === wid && inR(l.date));
  const earned = r2(sum(jobs, j => j.amt)), adv = r2(sum(L.filter(l => l.type === 'advance'), l => l.amount)), paid = r2(sum(L.filter(l => l.type === 'payment'), l => l.amount)), adj = r2(sum(L.filter(l => l.type === 'adjustment'), l => l.amount));
  return {jobs, L, earned, adv, paid, adj, bal: r2(earned + adj - adv - paid)};
}
function vendorAccount(vid, from, to){
  const inR = d => (!from || d >= from) && (!to || d <= to);
  const jobs = []; coll('garments').forEach(g => g.steps.forEach(s => { if(s.vendorId === vid && isOut(s) && s.status !== 'pending' && s.status !== 'skipped' && s.startedAt && inR(iso(new Date(s.startedAt)))) jobs.push({g, s, amt: r2(num(s.charge))}); }));
  const L = coll('ledger').filter(l => l.party === 'vendor' && l.partyId === vid && inR(l.date));
  const charges = r2(sum(jobs, j => j.amt)), adv = r2(sum(L.filter(l => l.type === 'advance'), l => l.amount)), paid = r2(sum(L.filter(l => l.type === 'payment'), l => l.amount));
  return {jobs, L, charges, adv, paid, bal: r2(charges - adv - paid)};
}
function vendorJobs(){
  const out = []; coll('garments').forEach(g => { const o = ord(g.orderId); if(!o || o.status === 'cancelled') return; g.steps.forEach(s => { if(isOut(s) && s.status !== 'skipped') out.push({g, s, o, due: s.status === 'in_progress' ? (s.expectedReturn || dayISO(addShopWorkdays(dayIdx(iso(new Date(s.startedAt))), s.tat || 1))) : ''}); }); });
  return out;
}

/* ---------------- alerts ----------------
   Every alert names the garment, the pending task and who is responsible. */
function allAlerts(){
  const sc = sched(), S = ST(), A = [], today = todayISO(), warn = iso(addDays(new Date(), num(S.warnDays) || 2));
  const add = (key, sev, cat, title, detail, ref) => A.push(Object.assign({key, sev, cat, title, detail}, ref || {}));
  const who = s => isOut(s) ? (vendor(s.vendorId)?.name || 'vendor not set') : (worker(s.workerId || sc.T[s.id]?.wid)?.name || 'unassigned');
  coll('garments').forEach(g => {
    const o = ord(g.orderId); if(!o || o.status === 'cancelled') return;
    const st = gStatus(g), c = cust(g.customerId) || {}, tag = `${g.no} ${g.title} (${c.name || '—'})`, ref = {gid: g.id, oid: g.orderId};
    if(st === 'ready' && g.deliveryDate && g.deliveryDate < today && !g.delivery?.delivered) add('uncollected:' + g.id, 'medium', 'delivery', 'Ready but not collected', `${tag} has been ready since before ${fmtD(g.deliveryDate)}. Notify the customer.`, ref);
    if(!gLive(g) || g.status === 'hold' || st === 'ready') return;
    const x = sc.G[g.id];
    if(g.deliveryDate && g.deliveryDate < today) add('late:' + g.id, 'critical', 'delivery', 'Delivery date passed', `${tag} was due on ${fmtD(g.deliveryDate)}. Now at: ${gStageLabel(g)} (${currentSteps(g).map(who).join(', ') || '—'}).`, ref);
    else if(x && x.late){ const cs = currentSteps(g)[0]; add('risk:' + g.id, 'high', 'delivery', 'Delivery at risk', `${tag}: expected ready ${fmtD(x.ready)}, delivery ${fmtD(g.deliveryDate)}.${cs ? ` Pending: ${stg(cs).name} – ${cs.label} (${who(cs)}).` : ''}`, ref); }
    else if(g.deliveryDate && g.deliveryDate <= warn && st !== 'ready') add('soon:' + g.id, 'medium', 'delivery', 'Delivery approaching', `${tag} is due ${fmtD(g.deliveryDate)} and is at ${gStageLabel(g)}.`, ref);
    const stT = groupTarget(g, 'stitching'), stDone = liveSteps(g).filter(s => stg(s).group === 'stitching').every(s => s.status === 'done');
    if(!stDone && stT && stT < today && liveSteps(g).some(s => stg(s).group === 'stitching')){
      const pend = liveSteps(g).filter(s => stg(s).group === 'stitching' && s.status !== 'done');
      add('stitchlate:' + g.id, 'high', 'step', 'Stitching target missed', `${tag}: stitching was due by ${fmtD(stT)} (${num(S.lead?.stitching)} days before delivery). Pending: ${pend.map(s => s.label + ' – ' + who(s)).join('; ')}.`, ref);
    }
    if(!g.design?.approvedV && (g.design?.versions || []).length && liveSteps(g).some(s => ['cut', 'emb'].includes(s.stageId) && s.status !== 'pending')) add('noappr:' + g.id, 'high', 'design', 'Production started without approved design', `${tag}: cutting/embroidery has started but no design version is marked customer-approved.`, ref);
    if(g.design?.approvedV && g.design.versions.length > g.design.approvedV) add('designmod:' + g.id + ':' + g.design.versions.length, 'high', 'design', 'Design changed after approval', `${tag}: version ${g.design.versions.length} is newer than the approved version ${g.design.approvedV}. Get the change approved before production continues.`, ref);
    const q = lastQC(g); if(q && q.result === 'fail' && st !== 'ready') add('qcfail:' + g.id + q.id, 'high', 'qc', 'QC failed – rework pending', `${tag}: QC on ${fmtD(q.at)} failed. ${q.notes || ''}`, ref);
    liveSteps(g).forEach(s => {
      if(s.status === 'done') return;
      const lbl = `${stg(s).name} – ${s.label}`, sref = Object.assign({stepId: s.id, wid: s.workerId || sc.T[s.id]?.wid, vid: s.vendorId}, ref), tgt = stepTarget(s, g), X = sc.T[s.id] || {};
      if(kindOf(s) === 'external'){
        if(!s.vendorId) add('novendor:' + s.id, 'medium', 'vendor', 'Outside work has no vendor', `${tag}: ${lbl} needs a vendor.`, sref);
        if(s.status === 'in_progress'){
          const due = s.expectedReturn || dayISO(addShopWorkdays(dayIdx(iso(new Date(s.startedAt))), s.tat || 1));
          if(due < today) add('vend:' + s.id, 'high', 'vendor', 'Vendor return overdue', `${tag}: ${lbl} at ${vendor(s.vendorId)?.name || 'vendor'} was due back ${fmtD(due)} (handed over ${fmtD(s.startedAt)}).`, sref);
          else if(due <= warn) add('vendsoon:' + s.id, 'medium', 'vendor', 'Vendor return due', `${tag}: ${lbl} due back from ${vendor(s.vendorId)?.name || 'vendor'} on ${fmtD(due)}.`, sref);
        }
        return;
      }
      if(kindOf(s) === 'trial'){
        const tr = (g.trials || []).find(t => t.stepId === s.id && t.status === 'scheduled');
        if(tr && tr.date < today) add('trialmiss:' + tr.id, 'high', 'trial', 'Trial missed / not recorded', `${tag}: trial was booked for ${fmtD(tr.date)} — record the outcome or reschedule.`, sref);
        else if(tr && tr.date === today) add('trialtoday:' + tr.id, 'medium', 'trial', 'Trial today', `${tag}: trial at ${tr.time || '—'} today.`, sref);
        else if(!tr && currentSteps(g).includes(s)) add('trialbook:' + s.id, 'medium', 'trial', 'Trial to be booked', `${tag}: ready for trial — book an appointment (target ${fmtD(tgt)}).`, sref);
        return;
      }
      if(X.none) add('noworker:' + s.id, 'critical', 'step', 'No worker can take this step', `${tag}: ${lbl} — no active worker has the "${stg(s).name}" skill (or all are on leave).`, sref);
      else if(!s.workerId && kindOf(s) === 'work') add('unassigned:' + s.id, 'low', 'step', 'Step not assigned', `${tag}: ${lbl} has no worker (planned on ${worker(X.wid)?.name || '—'}).`, sref);
      if(tgt && tgt < today) add('overdue:' + s.id, 'high', 'step', 'Step past target date', `${tag}: ${lbl} target was ${fmtD(tgt)} — ${who(s)}, status ${s.status === 'in_progress' ? 'in progress' : 'not started'}.`, sref);
      else if(tgt && tgt <= warn && currentSteps(g).includes(s)) add('due:' + s.id, 'low', 'step', 'Step due soon', `${tag}: ${lbl} due ${fmtD(tgt)} — ${who(s)}.`, sref);
      if(s.status === 'in_progress' && kindOf(s) === 'work'){
        const w = worker(s.workerId), el = elapsedWorkHours(s, w), H = taskHours(s, g);
        if(H && el > H * (1 + num(S.overrunPct) / 100)) add('overrun:' + s.id, 'medium', 'step', 'Step overrunning estimate', `${tag}: ${lbl} by ${w?.name || '—'} ~${el.toFixed(1)} h elapsed vs ${H} h estimated.`, sref);
      }
      if(s.status === 'pending' && s.workerId){ const w = worker(s.workerId); const d = dayIdx(stepPlanned(s)?.start || todayISO()); if(w && workerOffReason(w, Math.max(0, d)).startsWith('Leave')) add('leave:' + s.id, 'high', 'worker', 'Assigned worker on leave', `${tag}: ${lbl} is assigned to ${w.name}, who is on leave when it is planned. Reassign it.`, sref); }
    });
  });
  const ws = workerStats();
  coll('workers').filter(w => w.active !== false).forEach(w => { const qd = queueDays(w.id, ws[w.id]); if(qd > num(S.overloadDays)) add('overload:' + w.id, 'medium', 'worker', 'Worker overloaded', `${w.name} has ${ws[w.id].hrs.toFixed(1)} h of work queued = ${qd} working days at ${capPerDay(w).toFixed(1)} h/day (limit ${S.overloadDays} days).`, {wid: w.id}); });
  coll('inventory').filter(i => i.active !== false).forEach(i => { const s = stockOf(i.id), req = requiredOf(i.id); if(req > s) add('short:' + i.id, 'high', 'material', 'Material shortage', `${i.name}: ${req} ${i.unit} still to issue for open garments, only ${s} in stock.`); else if(s <= num(i.reorder)) add('low:' + i.id, 'low', 'material', 'Low stock', `${i.name}: ${s} ${i.unit} left (reorder level ${i.reorder}).`); });
  coll('orders').filter(o => o.status !== 'cancelled').forEach(o => { const gs = activeG(o); if(gs.length && gs.every(g => gStatus(g) === 'delivered')){ const t = orderTotals(o); if(t.bal > 1) add('due:' + o.id, 'medium', 'payment', 'Balance pending after delivery', `${o.no} (${cust(o.customerId)?.name}): ${inr(t.bal)} outstanding.`, {oid: o.id}); } });
  const rank = {critical: 0, high: 1, medium: 2, low: 3};
  return A.sort((a, b) => rank[a.sev] - rank[b.sev]);
}
const activeAlerts = () => allAlerts().filter(a => !(DB.state?.ack || {})[a.key]);

/* ---------------- finance ---------------- */
function finance(from, to){
  const inR = d => d && d >= from && d <= to;
  const invs = coll('invoices').filter(i => inR(i.date));
  const byHead = {}; invs.forEach(i => i.blocks.forEach(b => b.lines.forEach(l => byHead[l.head] = (byHead[l.head] || 0) + num(l.amount))));
  let labour = 0, vendorX = 0; const labourBy = {};
  coll('garments').forEach(g => g.steps.forEach(s => {
    if(s.status !== 'done' || !s.doneAt || !inR(iso(new Date(s.doneAt)))) return;
    const a = stepAmount(s, g); if(isOut(s)) vendorX += a; else { labour += a; labourBy[s.workerId] = (labourBy[s.workerId] || 0) + a; }
  }));
  const material = r2(sum(coll('movements').filter(m => m.type === 'out' && inR(m.date)), m => num(m.qty) * num(m.rate)));
  const collections = []; coll('orders').forEach(o => (o.payments || []).forEach(p => { if(inR(p.date)) collections.push({o, p}); }));
  const revenue = r2(sum(invs, i => i.taxable)), gst = r2(sum(invs, i => i.tax)), expenses = r2(labour + vendorX + material);
  // matched cost: what the invoiced garments actually cost (materials + labour + vendors)
  let cogs = 0; invs.forEach(i => i.garmentIds.forEach(id => { const g = gar(id); if(g) cogs += garmentCost(g).total; }));
  let receivable = 0; coll('orders').filter(o => o.status !== 'cancelled').forEach(o => { const t = orderTotals(o); if(t.bal > 0) receivable += t.bal; });
  let payW = 0, payV = 0; coll('workers').forEach(w => payW += Math.max(0, workerAccount(w.id).bal)); coll('vendors').forEach(v => payV += Math.max(0, vendorAccount(v.id).bal));
  const byOrder = coll('orders').filter(o => o.status !== 'cancelled').map(o => { const t = orderTotals(o); return {o, price: t.taxable, cost: t.cost, profit: r2(t.taxable - t.cost), pct: t.taxable ? Math.round((t.taxable - t.cost) / t.taxable * 100) : 0, bal: t.bal}; });
  const byType = {}; coll('garments').filter(g => g.status !== 'cancelled').forEach(g => { const b = garmentBill(g); const k = tpl(g.tplId)?.name || '—'; const x = byType[k] || (byType[k] = {n: 0, price: 0, cost: 0}); x.n++; x.price += b.total; x.cost += b.cost; });
  return {invs, byHead, revenue, gst, labour: r2(labour), labourBy, vendor: r2(vendorX), material, expenses, cogs: r2(cogs), profit: r2(revenue - cogs), collections, collected: r2(sum(collections, c => c.p.amount)), receivable: r2(receivable), payW: r2(payW), payV: r2(payV), byOrder, byType};
}

/* ---------------- boot ---------------- */

function migrate(){

  ['lead'].forEach(k => Object.keys(d[k]).forEach(j => { if(s[k][j] === undefined) s[k][j] = d[k][j]; }));

  DB.state = DB.state || {ack: {}, notified: {}, backups: []}; DB.counters = DB.counters || {order: 1001, inv: 1, rcpt: 1}; DB.access = DB.access || {roles: {}};
  if(!coll('stages').length) DB.stages = defaultStages();
  if(!coll('templates').length) DB.templates = defaultTemplates();
  if(!coll('msgTemplates').length) DB.msgTemplates = defaultMsgTemplates();
  migrateMeasure(); migrateHeads();
}
/* invoice charge heads aligned to the studio's own invoice columns */
function migrateHeads(){
  const s = DB.settings; if(s._invV) return;
  const mp = id => OLD_HEAD[id] || id, known = new Set(INVOICE_HEADS.map(x => x.id));
  const extra = (s.heads || []).filter(x => !known.has(mp(x.id)));
  s.heads = INVOICE_HEADS.map(x => ({...x})).concat(extra);
  const dc = defaultSettings().categories; (s.categories || []).forEach(c => { const d = dc.find(x => x.id === c.id); c.head = d ? d.head : mp(c.head); }); dc.forEach(d => { if(!s.categories.some(c => c.id === d.id)) s.categories.push({...d}); });
  const ds = defaultStages(); coll('stages').forEach(st => { const d = ds.find(x => x.id === st.id); st.head = d ? d.head : mp(st.head); }); ds.forEach(d => { if(!coll('stages').some(x => x.id === d.id)) DB.stages.push({...d}); });
  const fixSteps = L => (L || []).forEach(x => { if(x.head) x.head = mp(x.head); });
  coll('templates').forEach(t => fixSteps(t.workflow));
  coll('garments').forEach(g => { fixSteps(g.steps); (g.extras || []).forEach(x => x.head = mp(x.head)); if(g.headPrice){ const hp = {}; Object.entries(g.headPrice).forEach(([k, val]) => { const nk = mp(k); hp[nk] = hp[nk] !== undefined ? num(hp[nk]) + num(val) : val; }); g.headPrice = hp; } });
  if(/Couture · Bridal/.test(s.tagline || '')) s.tagline = 'Crafted with care, worn with love';
  if(!s.invoiceFooter) s.invoiceFooter = 'Thank you for choosing ' + (s.shop || 'us') + '!';
  if(s.invoiceNote === undefined) s.invoiceNote = 'Please check your garments at the time of collection.';
  s._invV = 1;
}
/* article measurement sheets + family members (added later; safe to run every start) */
function migrateMeasure(){
  const defs = defaultTemplates();
  defs.filter(t => t.charts).forEach(dt => { const t = tpl(dt.id); if(!t){ if(!DB.settings._artV) DB.templates.push(dt); } else if(!t.charts){ t.charts = dt.charts.slice(); t.category = dt.category; } });
  coll('templates').forEach(t => { if((t.charts || []).length) t.fields = chartFields(t.charts); });
  DB.settings._artV = 1;
  coll('customers').forEach(c => members(c));

document.addEventListener('input', e => bind(e, false));

function rootOf(name){ return name === 'DB' ? DB : name === 'GD' ? UI.gd : name === 'X' ? UI.x : EDIT; }
function bind(e, isChange){
  const el = e.target, p = el.dataset && el.dataset.p; if(!p) return;
  const rn = el.dataset.root || 'EDIT', root = rootOf(rn); if(!root) return;
  if(!isChange && (el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'radio')) return;
  let val = el.type === 'checkbox' ? el.checked : el.value;
  if(el.type === 'number') val = el.value === '' ? '' : num(el.value);
  setPath(root, p, val); stepHooks(root, p, val);
  if(rn === 'EDIT' && /^garments\.\d+\.tplId$/.test(p)) draftTplChanged(+p.split('.')[1], val);
  if(rn === 'EDIT' && /^garments\.\d+\.profileId$/.test(p)) draftProfileChanged(+p.split('.')[1], val);
  if(rn === 'EDIT' && /^garments\.\d+\.memberId$/.test(p)) draftMemberChanged(+p.split('.')[1], val);
  if(rn === 'EDIT' && p === 'customerId') draftCustomerChanged();

function trail(g, compact){
  const out = [], seen = new Set(), today = todayISO();
  orderedSteps(g).forEach(s => {
    const key = compact ? s.stageId + (s.round > 1 ? 'r' : '') : s.id; if(seen.has(key)) return; seen.add(key);
    const grp = compact ? g.steps.filter(x => x.stageId === s.stageId && (x.round > 1) === (s.round > 1)) : [s];
    const live = grp.filter(x => x.status !== 'skipped'), done = live.length && live.every(x => x.status === 'done'), skip = !live.length, prog = live.some(x => x.status === 'in_progress'), late = !done && live.some(x => stepTarget(x, g) < today);
    out.push(`<span class="st ${done ? 'done' : skip ? 'skip' : prog ? 'prog' : ''} ${late && !prog ? 'late' : ''} ${isOut(s) ? 'ext' : ''}" title="${h(grp.map(x => x.label).join(', '))}">${done ? '✓ ' : ''}${h(stg(s).name.split(' (')[0])}${s.round > 1 ? ' ↺' : ''}${compact && live.length > 1 ? ` ×${live.length}` : ''}</span>`);
  });
  const st = gStatus(g); out.push(`<span class="st ${st === 'delivered' ? 'done' : st === 'ready' ? 'prog' : ''}">${st === 'delivered' ? '✓ Delivered' : 'Delivery'}</span>`);
  return out.join('<span class="arrow">›</span>');
}

function stepRow(g, s, ed){
  const k = kindOf(s), p = stepPlanned(s), tgt = stepTarget(s, g), today = todayISO(), x = p?.x || {};

    if(x.none) planned = '<span class="chip c-bad">No skilled worker free</span>';
    else if(k === 'external' && s.status === 'in_progress') planned = `back by ${dateChip(x.due)}`;
    else if(k === 'trial') planned = x.trial ? `trial ${fmtDs(x.trial)}` : `book ~${fmtDs(p?.start)}`;
    else if(p) planned = `${fmtDs(p.start)} → ${fmtDs(p.end)}`;
  }
  const actual = s.startedAt ? `${fmtDT(s.startedAt)}${s.doneAt ? '<br>→ ' + fmtDT(s.doneAt) : ''}` : '—';
  let act = '';
  if(ed && gLive(g)){
    if(s.status === 'pending'){
      if(k === 'trial') act = `<button class="sm" onclick="bookTrial('${g.id}','${s.id}')">Book</button>`;
      else if(k === 'qc') act = `<button class="sm" onclick="doQC('${g.id}','${s.id}')">Do QC</button>`;
      else act = `<button class="sm" onclick="startStep('${g.id}','${s.id}')">${k === 'external' ? 'Send out' : '▶ Start'}</button>`;
      act += ` <button class="sm ghost" title="Mark done" onclick="doneStep('${g.id}','${s.id}')">✓</button>`;
    } else if(s.status === 'in_progress'){
      act = k === 'trial' ? `<button class="sm pri" onclick="recordTrialFor('${g.id}','${s.id}')">Record</button>` : `<button class="sm pri" onclick="doneStep('${g.id}','${s.id}')">${k === 'external' ? 'Received' : '✓ Done'}</button>`;
      act += ` <button class="sm ghost" title="Undo" onclick="undoStep('${g.id}','${s.id}')">↶</button>`;
    } else if(s.status === 'done') act = `<button class="sm ghost" title="Repeat this step" onclick="repeatStep('${g.id}','${s.id}')">↻</button> <button class="sm ghost" title="Undo" onclick="undoStep('${g.id}','${s.id}')">↶</button>`;
    else act = `<button class="sm ghost" onclick="skipStep('${g.id}','${s.id}',false)">Un-skip</button>`;
  }
  return `<tr class="${s.status !== 'done' && s.status !== 'skipped' && tgt < today ? 'late' : ''}" style="${s.status === 'skipped' ? 'opacity:.5' : ''}"><td class="muted">${h(s.seq)}</td><td>${h(stg(s).name)}${s.round > 1 ? ` <span class="chip c-warn">round ${s.round}</span>` : ''}</td><td>${h(s.label)}${s.rework ? `<div class="muted" style="font-size:12px">↩ ${h(s.rework)}</div>` : ''}</td><td>${stepWho(s)}</td><td>${s.status === 'done' || s.status === 'skipped' ? fmtDs(tgt) : dateChip(tgt)}</td><td style="font-size:12.5px">${planned}</td><td style="font-size:12px">${actual}</td><td>${stepStatusChip(s)}</td><td class="nowrap">${act}</td></tr>`;
}
function gantt(g){
  const sc = sched(), rows = []; let lo = 0, hi = 1;
  orderedSteps(g).forEach(s => {
    if(s.status === 'skipped') return; const x = sc.T[s.id] || {}; let a, b, cls;
    if(s.status === 'done'){ a = s.startedAt ? dayIdx(iso(new Date(s.startedAt))) : (x.e || 0) - 0.5; b = Math.max(a + 0.4, (s.doneAt ? dayIdx(iso(new Date(s.doneAt))) : a) + 1); cls = 'done'; }
    else if(!gLive(g) || x.none || x.s == null) return;
    else { a = x.segS ?? x.s; b = Math.max(x.e, a + 0.2); cls = kindOf(s) === 'trial' ? 'trial' : isOut(s) ? 'ext' : s.status === 'in_progress' ? 'prog' : ''; if(x.overdue) cls += ' late'; }
    rows.push({lab: `${stg(s).name} · ${s.label}`, sub: isOut(s) ? vendor(s.vendorId)?.name || '' : worker(s.workerId || x.wid)?.name || '', a, b, cls});
    lo = Math.min(lo, Math.floor(a)); hi = Math.max(hi, Math.ceil(b));
  });
  if(!rows.length) return '<div class="muted">Nothing to plot.</div>';
  const di = g.deliveryDate ? dayIdx(g.deliveryDate) + 1 : null; if(di != null) hi = Math.max(hi, di);
  lo = Math.max(lo, -45); hi = Math.min(hi, lo + 75);
  const span = hi - lo, pos = v2 => ((v2 - lo) / span * 100).toFixed(2) + '%', step = Math.max(1, Math.ceil(span / 14));
  let ticks = ''; for(let d = lo; d < hi; d += step) ticks += `<span class="g-tick" style="left:${pos(d + 0.5)}">${dayDate(d).toLocaleDateString('en-IN', {day: 'numeric', month: 'short'})}</span>`;
  const lines = `<div class="g-line" style="left:${pos(0)}" title="Today"></div>${di != null ? `<div class="g-line prom" style="left:${pos(di)}" title="Delivery"></div>` : ''}`;
  return `<div class="gantt"><div class="g-head"><div class="g-lab muted">Step</div><div class="g-track">${ticks}</div></div>${rows.map(r => `<div class="g-row"><div class="g-lab" title="${h(r.lab)}">${h(r.lab)}<div class="muted" style="font-size:10.5px">${h(r.sub)}</div></div><div class="g-track">${lines}<div class="g-bar ${r.cls}" style="left:${pos(Math.max(lo, r.a))};width:calc(${((Math.min(hi, r.b) - Math.max(lo, r.a)) / span * 100).toFixed(2)}% - 1px)"></div></div></div>`).join('')}</div>
  <div class="g-legend"><span><i style="background:#9ccfb0"></i>Done</span><span><i style="background:var(--accent)"></i>In progress</span><span><i style="background:#c9a3b4"></i>Planned</span><span><i style="background:#9fb6d1"></i>Outside vendor</span><span><i style="background:#7fb8ab"></i>Trial</span><span><i style="border-left:2px solid var(--info);width:2px"></i>Today</span><span><i style="border-left:2px dashed var(--bad);width:2px"></i>Delivery</span></div>`;
}
function editTargets(gid){

  prompt2('Adjust target dates · ' + g.no, [{k: 'deliveryDate', label: 'Customer collection / delivery', type: 'date', value: g.deliveryDate}, ...groups.map(([k, l]) => ({k, label: `${l} (default ${fmtDs(groupTarget({...g, targets: {}}, k))})`, type: 'date', value: g.targets?.[k] || ''}))], x => {

/* ---------------- step actions ---------------- */
function findStep(gid, sid){ const g = gar(gid); return {g, s: g && g.steps.find(x => x.id === sid)}; }
function startStep(gid, sid, force){
  const {g, s} = findStep(gid, sid); if(!s) return;
  const groups = stepGroups(g), gi = groups.findIndex(x => x.includes(s));
  if(!force && gi > 0 && !groups.slice(0, gi).every(x => x.every(y => y.status === 'done'))) return ask('Earlier steps for this garment are not finished. Start anyway?', () => startStep(gid, sid, true), 'Start anyway');
  if(!force && ['cut', 'emb'].includes(s.stageId) && !g.design?.approvedV && (g.design?.versions || []).length) return ask('No design version is customer-approved yet. Starting cutting or embroidery now risks a production mistake. Start anyway?', () => startStep(gid, sid, true), 'Start anyway');
  if(isOut(s)){
    const vs = coll('vendors').filter(x => x.active !== false);
    return prompt2(`Send to vendor · ${stg(s).name} – ${s.label}`, [{k: 'vendorId', label: 'Vendor', type: 'select', value: s.vendorId, options: [['', '— choose —'], ...vs.map(x => [x.id, x.name])], required: true}, {k: 'handover', label: 'Handover date', type: 'date', value: todayISO()}, {k: 'expectedReturn', label: 'Expected return', type: 'date', value: dayISO(addShopWorkdays(0, s.tat || 2))}, ...(can('prices') ? [{k: 'charge', label: 'Vendor charge ₹', type: 'number', value: s.charge}, {k: 'advance', label: 'Advance paid now ₹', type: 'number', value: ''}] : []), {k: 'note', label: 'Handover note', full: true}], x => {
      const before = clone(g); s.vendorId = x.vendorId; s.status = 'in_progress'; s.startedAt = new Date(x.handover + 'T' + new Date().toTimeString().slice(0, 8)).toISOString(); s.expectedReturn = x.expectedReturn; if(x.charge !== undefined && x.charge !== '') s.charge = num(x.charge); s.handoverNote = x.note;
      if(num(x.advance) > 0) coll('ledger').push({id: uid('lg'), party: 'vendor', partyId: s.vendorId, date: x.handover, type: 'advance', amount: num(x.advance), mode: 'Cash', note: `Advance for ${g.no} ${stg(s).name}`, by: meName(), garmentId: g.id});
      coll('custMaterials').filter(m => m.garmentId === g.id && m.status !== 'returned').forEach(m => { m.status = 'with_vendor'; m.log.push({at: nowISO(), status: 'with_vendor', note: 'With ' + vendor(s.vendorId)?.name, by: meName()}); });
      gLog(g, `${stg(s).name} – ${s.label} handed to ${vendor(s.vendorId)?.name}, due ${fmtD(s.expectedReturn)}`, before); save(); render(); toast('Handover recorded', 'ok');
    }, 'Record handover');
  }
  if(!s.workerId){ const sug = sched().T[s.id]?.wid; if(!sug) return toast('Assign a worker first (Production plan tab)', 'bad'); return ask(`Assign to ${worker(sug).name} and start?`, () => { s.workerId = sug; startStep(gid, sid, true); }); }
  const before = clone(g); s.status = 'in_progress'; s.startedAt = nowISO();
  coll('custMaterials').filter(m => m.garmentId === g.id && m.status === 'received').forEach(m => { m.status = 'in_production'; m.log.push({at: nowISO(), status: 'in_production', note: 'Issued for ' + stg(s).name, by: meName()}); });
  gLog(g, `${stg(s).name} – ${s.label} started by ${worker(s.workerId)?.name}`, before); save(); render(); checkNotify();
}
function doneStep(gid, sid){
  const {g, s} = findStep(gid, sid); if(!s) return; const k = kindOf(s);
  if(k === 'qc') return doQC(gid, sid);
  if(k === 'trial') return recordTrialFor(gid, sid);
  if(k === 'external'){
    return prompt2(`Received back · ${stg(s).name} – ${s.label}`, [{k: 'date', label: 'Actual return date', type: 'date', value: todayISO()}, ...(can('prices') ? [{k: 'charge', label: 'Final vendor charge ₹', type: 'number', value: s.charge}] : []), {k: 'note', label: 'Condition / note', full: true}], x => {
      const before = clone(g); s.status = 'done'; s.startedAt = s.startedAt || nowISO(); s.doneAt = new Date(x.date + 'T' + new Date().toTimeString().slice(0, 8)).toISOString(); if(x.charge !== undefined && x.charge !== '') s.charge = num(x.charge); s.returnNote = x.note;
      coll('custMaterials').filter(m => m.garmentId === g.id && m.status === 'with_vendor').forEach(m => { m.status = 'in_production'; m.log.push({at: nowISO(), status: 'in_production', note: 'Back from ' + (vendor(s.vendorId)?.name || 'vendor'), by: meName()}); });

    }, 'Mark received');

function skipStep(gid, sid, on){ const {g, s} = findStep(gid, sid); const before = clone(g); s.status = on ? 'skipped' : 'pending'; gLog(g, `${stg(s).name} – ${s.label} ${on ? 'skipped' : 'restored'}`, before); save(); render(); }

    openModal(`<div class="mbar"><b>Quality check · ${h(g.no)} ${h(g.title)}</b><span class="sp"></span><button onclick="closeModal()">Close</button></div>
    <div class="row" style="margin-bottom:10px"><button class="sm" onclick="document.querySelectorAll('.qcp').forEach(x=>x.checked=true)">Mark all pass</button></div>
    ${CL.map((sec, si) => `<div class="qc-sec"><b>${h(sec.sec)}</b>${sec.items.map((it, ii) => `<div class="qc-item"><span>${h(it)}</span><div class="seg"><label class="p"><input type="radio" class="qcp" name="q${si}_${ii}" value="pass" data-k="${h(sec.sec + ': ' + it)}">Pass</label><label class="x"><input type="radio" name="q${si}_${ii}" value="fail" data-k="${h(sec.sec + ': ' + it)}">Fail</label><label><input type="radio" name="q${si}_${ii}" value="na" data-k="${h(sec.sec + ': ' + it)}">N/A</label></div></div>`).join('')}</div>`).join('')}
    <label>Notes / defects found</label><textarea id="qcNotes" rows="2"></textarea>
    <div class="row" style="margin-top:12px"><span class="sp"></span><button class="pri" onclick="saveQC('${gid}','${step.id}')">Save QC result</button></div>`);
  };
  if(before.length) return ask(`${before.length} earlier step(s) are not finished (${before.map(s => stg(s).name).join(', ')}). Do QC anyway?`, go2, 'Continue');
  go2();
}
function saveQC(gid, sid){
  const g = gar(gid), step = g.steps.find(s => s.id === sid), checks = {}; let missing = 0;
  document.querySelectorAll('.qc-item').forEach(row => { const sel = row.querySelector('input:checked'); if(!sel){ missing++; return; } checks[sel.dataset.k] = sel.value; });
  if(missing) return toast(`${missing} checklist item(s) not marked`, 'bad');
  const fails = Object.entries(checks).filter(([, x]) => x === 'fail').map(([k]) => k), notes = document.getElementById('qcNotes').value, before = clone(g);
  const rec = {id: uid('q'), at: nowISO(), by: meName(), result: fails.length ? 'fail' : 'pass', checks, notes: notes || (fails.length ? 'Failed: ' + fails.join('; ') : ''), stepId: sid};
  (g.qc = g.qc || []).push(rec); closeModal();
  if(!fails.length){ step.status = 'done'; step.startedAt = step.startedAt || nowISO(); step.doneAt = nowISO(); step.workerId = step.workerId || (ME.workerId || ''); gLog(g, 'QC passed — ready for delivery', before); save(); render(); toast('QC passed — garment is ready', 'ok'); return; }
  gLog(g, 'QC failed: ' + fails.join('; '), before); save(); render();
  ask(`QC failed on ${fails.length} item(s). Send the garment back to a stage for correction now?`, () => sendBack(gid), 'Send back');
}
function deliveryStep(gid, k){
  const g = gar(gid), o = ord(g.orderId), before = clone(g); g.delivery = g.delivery || {};
  if(k === 'notified'){ g.delivery.notified = {at: nowISO(), by: meName()}; gLog(g, 'Customer notified that garment is ready', before); save(); render(); if(can('comms')) openCompose(g.orderId, 'ready', null, null, g.id); return; }
  if(k !== 'delivered'){ g.delivery[k] = {at: nowISO(), by: meName()}; gLog(g, k === 'pressed' ? 'Steam pressed' : 'Packed', before); save(); render(); return; }
  const T = orderTotals(o), c = cust(g.customerId);
  prompt2('Hand over · ' + g.no + ' ' + g.title, [{k: 'receivedBy', label: 'Received by', value: c?.name || '', required: true}, {k: 'relation', label: 'Relation', value: 'Self'}, {k: 'when', label: 'Date & time', type: 'datetime-local', value: new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 16)}, ...(can('billing') ? [{k: 'collected', label: `Payment collected now ₹ (balance ${inr(T.bal)})`, type: 'number', value: ''}, {k: 'mode', label: 'Mode', type: 'select', options: ['UPI', 'Cash', 'Card', 'Bank transfer']}] : []), {k: 'notes', label: 'Handover notes', type: 'textarea', full: true}], async x => {
    g.delivery.delivered = {at: new Date(x.when).toISOString(), by: meName(), receivedBy: x.receivedBy, relation: x.relation, notes: x.notes, collected: num(x.collected)};
    if(!g.delivery.packed) g.delivery.packed = {at: nowISO(), by: meName()};
    coll('custMaterials').filter(m => m.garmentId === g.id && m.status !== 'returned').forEach(m => { m.status = 'returned'; m.log.push({at: nowISO(), status: 'returned', note: 'Returned with garment / leftovers', by: meName()}); });
    if(num(x.collected) > 0){ const n = await nextNo('rcpt'); o.payments.push({id: uid('p'), date: todayISO(), amount: num(x.collected), mode: x.mode, type: 'final', note: 'Collected at delivery of ' + g.no, receiptNo: ST().rcptPrefix + String(n).padStart(4, '0'), by: meName()}); }
    gLog(g, `Delivered to ${x.receivedBy}${x.relation ? ' (' + x.relation + ')' : ''}`, before);
    const rest = activeG(o).filter(z => z.id !== g.id && gStatus(z) !== 'delivered');
    o.history.push({at: nowISO(), by: meName(), action: `${g.no} delivered${rest.length ? ` — partial delivery, ${rest.length} garment(s) pending` : ' — order fully delivered'}`, changes: []});
    save(); render();
    if(can('billing') && !g.invoiceId) ask(`Garment delivered. Generate the invoice for ${g.no} now?`, () => { invoiceDialog(o.id); }, 'Invoice');
    else autoMsg(o.id, 'delivered', null, g.id);
  }, 'Confirm handover');
}

function setHeadPrice(gid, head, val){ const g = gar(gid), before = clone(g); g.headPrice = g.headPrice || {}; if(val === '') delete g.headPrice[head]; else g.headPrice[head] = num(val); gLog(g, `Price for ${headName(head)} ${val === '' ? 'reset to auto' : 'set to ' + inr(val)}`, before); save(); render(); }
function addExtra(gid){ const g = gar(gid); prompt2('Additional charge · ' + g.no, [{k: 'head', label: 'Charge head', type: 'select', value: 'other', options: ST().heads.map(x => [x.id, x.name])}, {k: 'desc', label: 'Description', required: true, full: true, placeholder: 'e.g. Customer changed neckline after approval'}, {k: 'amount', label: 'Amount ₹', type: 'number', required: true}], x => { const before = clone(g); (g.extras = g.extras || []).push({id: uid('x'), head: x.head, desc: x.desc, amount: num(x.amount), at: nowISO(), by: meName()}); gLog(g, `Additional charge ${inr(x.amount)}: ${x.desc}`, before); save(); render(); }, 'Add charge'); }

function rangeBar(){

const inRange = d => { const r = UI.prange || '14'; if(r === 'all') return true; return d && d <= iso(addDays(new Date(), +r)); };
function planStitch(){
  const sc = sched(), today = todayISO();
  const L = liveGarments().filter(g => liveSteps(g).some(s => stg(s).group === 'stitching')).map(g => { const st = liveSteps(g).filter(s => stg(s).group === 'stitching'), done = st.every(s => s.status === 'done'), tgt = groupTarget(g, 'stitching'), exp = done ? iso(new Date(st.map(s => s.doneAt).sort().pop())) : sc.G[g.id]?.exp?.stitching; return {g, st, done, tgt, exp, late: !done && ((tgt < today) || (exp && exp > tgt))}; })

function planDelivery(){
  const sc = sched(), today = todayISO();
  const L = coll('garments').filter(g => { const o = ord(g.orderId); return o && o.status !== 'cancelled' && g.status !== 'cancelled' && gStatus(g) !== 'delivered'; }).map(g => ({g, x: sc.G[g.id], late: (g.deliveryDate && g.deliveryDate < today) || sc.G[g.id]?.late}))

  return rangeBar() + `<div class="card">${L.length ? `<table class="stack"><thead><tr><th>Delivery</th><th>Garment</th><th>Now at</th><th>Expected ready</th><th>Trial</th>${can('prices') ? '<th class="n">Order balance</th>' : ''}<th>Status</th></tr></thead><tbody>${L.map(({g, x, late}) => { const tr = (g.trials || []).filter(t => t.status === 'scheduled').map(t => t.date).sort()[0];
    return `<tr class="click ${late ? 'late' : ''}" onclick="go('garment-${g.id}')"><td>${dateChip(g.deliveryDate)}</td><td><b>${h(g.no)}</b> ${urgentChip(g)}<div>${h(g.title)} · <span class="muted">${h(cust(g.customerId)?.name)}</span></div></td><td>${h(gStageLabel(g))}</td><td>${gStatus(g) === 'ready' ? '<span class="chip c-ok">Ready</span>' : x ? `<span class="chip ${x.late ? 'c-bad' : 'c-ok'}">${fmtDs(x.ready)}</span>` : '—'}</td><td>${tr ? fmtDs(tr) : '—'}</td>${can('prices') ? `<td class="n">${inr(Math.max(0, orderTotals(ord(g.orderId)).bal))}</td>` : ''}<td>${gChip(g)}</td></tr>`; }).join('')}</tbody></table>` : '<div class="empty">No deliveries in this range.</div>'}</div>`;

function planWeek(){
  const off = num(UI.pweek || 0), base = addDays(T0(), off * 7), mon = addDays(base, -((base.getDay() + 6) % 7)), today = todayISO(), sc = sched();
  const days = Array.from({length: 7}, (_, i) => iso(addDays(mon, i)));
  const ev = {}; days.forEach(d => ev[d] = []);
  coll('garments').forEach(g => { const o = ord(g.orderId); if(!o || o.status === 'cancelled' || g.status === 'cancelled') return; const live = gLive(g);
    if(live){ const tgt = groupTarget(g, 'stitching'), stDone = liveSteps(g).filter(s => stg(s).group === 'stitching').every(s => s.status === 'done'); if(ev[tgt] && !stDone && liveSteps(g).some(s => stg(s).group === 'stitching')) ev[tgt].push({cls: 'st', g, t: 'Stitch due · ' + g.no}); }

function planDaily(){

  if(tab === 'payments'){ const P = []; coll('orders').forEach(o => (o.payments || []).forEach(p => P.push({o, p}))); P.sort(by(x => x.p.date, -1)); return head + `<div class="card"><div class="row" style="margin-bottom:8px"><span class="sp"></span><button class="sm" onclick="exportPayments()">⬇ CSV</button></div><table class="stack"><thead><tr><th>Date</th><th>Receipt</th><th>Order</th><th>Customer</th><th>Type</th><th>Mode</th><th class="n">Amount</th><th></th></tr></thead><tbody>${P.map(({o, p}) => `<tr><td>${fmtD(p.date)}</td><td>${h(p.receiptNo || '')}</td><td><a href="#order-${o.id}">${h(o.no)}</a></td><td>${h(cust(o.customerId)?.name)}</td><td>${h(p.type || '')}</td><td>${h(p.mode)}</td><td class="n">${inr2(p.amount)}</td><td><button class="sm" onclick="receiptPDF('${o.id}','${p.id}')">Receipt PDF</button></td></tr>`).join('') || '<tr><td colspan="8" class="empty">No payments</td></tr>'}</tbody></table></div>`; }
  if(tab === 'toinvoice'){ const L = coll('garments').filter(g => gStatus(g) === 'delivered' && !g.invoiceId); return head + `<div class="card">${L.length ? `<table class="stack"><thead><tr><th>Garment</th><th>Customer</th><th>Delivered</th><th class="n">Amount</th><th></th></tr></thead><tbody>${L.map(g => `<tr><td><a href="#garment-${g.id}">${h(g.no)} ${h(g.title)}</a></td><td>${h(cust(g.customerId)?.name)}</td><td>${fmtD(g.delivery.delivered.at)}</td><td class="n">${inr(garmentBill(g).total)}</td><td><button class="sm pri" onclick="invoiceDialog('${g.orderId}')">Invoice</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty">Every delivered garment is invoiced.</div>'}</div>`; }
  const L = coll('orders').filter(o => o.status !== 'cancelled').map(o => ({o, T: orderTotals(o)})).filter(x => x.T.bal > 0.5).sort(by(x => x.T.bal, -1));
  return head + `<div class="kpis">${kpi('Total outstanding', inr(sum(L, x => x.T.bal)), 'warn')}${kpi('From delivered orders', inr(sum(L.filter(x => orderState(x.o)[0] === 'Delivered'), x => x.T.bal)), 'bad')}${kpi('Orders with balance', L.length)}</div>
  <div class="card"><table class="stack"><thead><tr><th>Order</th><th>Customer</th><th>Status</th><th class="n">Total</th><th class="n">Paid</th><th class="n">Balance</th><th></th></tr></thead><tbody>${L.map(({o, T}) => { const [sl, scl] = orderState(o); return `<tr><td><a href="#order-${o.id}"><b>${h(o.no)}</b></a></td><td>${h(cust(o.customerId)?.name)}<div class="muted" style="font-size:12px">${h(cust(o.customerId)?.phone)}</div></td><td><span class="chip ${scl}">${sl}</span></td><td class="n">${inr(T.total)}</td><td class="n">${inr(T.paid)}</td><td class="n"><b>${inr(T.bal)}</b></td><td class="nowrap"><button class="sm pri" onclick="recordPayment('${o.id}')">+ Payment</button> ${can('comms') ? `<button class="sm" onclick="openCompose('${o.id}','payment_reminder')">💬</button>` : ''}</td></tr>`; }).join('') || '<tr><td colspan="7" class="empty">Nothing outstanding</td></tr>'}</tbody></table></div>`;

function exportInvoices(){ const R = [['Invoice', 'Date', 'Order', 'Customer', 'Garment', 'Head', 'Amount', 'Invoice taxable', 'GST', 'Invoice total']]; coll('invoices').forEach(i => i.blocks.forEach(b => b.lines.forEach(l => R.push([i.no, i.date, ord(i.orderId)?.no, cust(i.customerId)?.name, b.no + ' ' + b.title, l.name, l.amount, i.taxable, i.tax, i.total])))); saveCSV(`invoices-${todayISO()}.csv`, R); }
function exportPayments(){ const R = [['Date', 'Receipt', 'Order', 'Customer', 'Type', 'Mode', 'Amount', 'Note']]; coll('orders').forEach(o => (o.payments || []).forEach(p => R.push([p.date, p.receiptNo, o.no, cust(o.customerId)?.name, p.type, p.mode, p.amount, p.note]))); saveCSV(`payments-${todayISO()}.csv`, R); }
